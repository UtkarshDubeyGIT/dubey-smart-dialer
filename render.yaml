services:
  - type: web
    name: credresolve-smart-dialer
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: smart-dialer serve --port $PORT
    preDeployCommand: alembic upgrade head
    initialDeployHook: smart-dialer seed-demo
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: credresolve-smart-dialer-db
          property: connectionString
      - key: PUBLIC_DEMO_READ_ONLY
        value: "true"

  - type: worker
    name: credresolve-smart-dialer-worker
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: smart-dialer worker
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: credresolve-smart-dialer-db
          property: connectionString

databases:
  - name: credresolve-smart-dialer-db
    plan: 0.1c-256mb
    region: singapore
    postgresMajorVersion: "16"
    databaseName: smartdialer
    user: smartdialer
    ipAllowList: []
