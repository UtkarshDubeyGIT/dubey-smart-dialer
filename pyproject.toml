[project]
name = "credresolve-smart-dialer"
version = "0.1.0"
description = "Safety-first progressive and predictive SmartDialer prototype"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.111,<1",
  "psycopg[binary]>=3.1,<4",
  "pydantic-settings>=2.3,<3",
  "sqlalchemy>=2.0,<3",
  "typer>=0.12,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
smart-dialer = "smart_dialer.cli:app"

[dependency-groups]
dev = [
  "hypothesis>=6.100,<7",
  "httpx>=0.27,<1",
  "pytest>=8.2,<9",
  "pytest-cov>=5,<7",
  "testcontainers[postgres]>=4.7,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smart_dialer"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: requires Docker and ephemeral PostgreSQL",
  "load: load and contention tests",
]
filterwarnings = [
  "ignore::starlette.exceptions.StarletteDeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["smart_dialer"]

[tool.coverage.report]
show_missing = true
skip_covered = true
