name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.11"
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run pytest
      - run: uv run smart-dialer simulate --output reports/simulation.json
      - run: docker compose config -q
